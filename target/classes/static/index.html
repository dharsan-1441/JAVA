<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Expense claims</title>
    <style>
        :root { --ink:#172225; --muted:#687478; --paper:#fffdf8; --line:#e5e0d7; --accent:#c95738; --soft:#f5ebe2; }
        * { box-sizing:border-box; } body { margin:0; color:var(--ink); background:#f2f0eb; font-family:Arial,sans-serif; }
        main { max-width:1160px; margin:auto; padding:40px 22px 70px; } header { display:flex; justify-content:space-between; align-items:end; gap:20px; margin-bottom:28px; }
        .eyebrow { color:var(--accent); font-size:12px; font-weight:700; letter-spacing:1.5px; text-transform:uppercase; } h1 { margin:9px 0 8px; font:500 clamp(34px,5vw,58px)/1 Georgia,serif; }
        .lede { max-width:620px; margin:0; color:var(--muted); line-height:1.5; } .date { color:var(--muted); font-size:13px; text-align:right; }
        .layout { display:grid; grid-template-columns:minmax(300px,380px) 1fr; gap:18px; align-items:start; } section { background:var(--paper); border:1px solid var(--line); padding:22px; } h2 { margin:0 0 18px; font:500 25px Georgia,serif; }
        label { display:block; margin:14px 0 6px; color:var(--muted); font-size:12px; font-weight:700; text-transform:uppercase; letter-spacing:.6px; } select,input { width:100%; padding:12px; border:1px solid var(--line); background:white; font:14px Arial,sans-serif; }
        .item { display:grid; grid-template-columns:1fr 110px; gap:8px; margin-bottom:8px; } .actions { display:flex; gap:8px; margin-top:16px; } button { border:1px solid var(--accent); background:var(--accent); color:white; cursor:pointer; padding:11px 14px; font-weight:700; } button.secondary { background:transparent; color:var(--accent); }
        .notice { display:none; background:var(--soft); padding:10px; margin-top:14px; color:#75402f; font-size:13px; } .notice.show { display:block; }
        .tabs { display:flex; gap:8px; flex-wrap:wrap; border-bottom:1px solid var(--line); padding-bottom:12px; margin-bottom:14px; } .tabs button { padding:8px 11px; font-size:12px; background:transparent; color:var(--muted); border-color:var(--line); } .tabs button.active { color:white; background:var(--ink); border-color:var(--ink); }
        .claim { border-top:1px solid var(--line); padding:16px 0; } .claim:first-child { border-top:0; padding-top:0; } .claim-head { display:flex; justify-content:space-between; gap:12px; } .claim-id { font-weight:700; } .status { font-size:11px; font-weight:700; color:var(--accent); } .claim p { margin:7px 0; color:var(--muted); font-size:13px; } .claim-actions { display:flex; gap:8px; margin-top:10px; } .claim-actions button { padding:8px 10px; font-size:12px; }
        .empty { color:var(--muted); font-size:14px; padding:12px 0; } @media (max-width:780px) { header { display:block; } .date { text-align:left; margin-top:14px; } .layout { grid-template-columns:1fr; } }
    </style>
</head>
<body><main>
    <header><div><div class="eyebrow">ExpenseClaim · approval workspace</div><h1>Make reimbursement feel orderly.</h1><p class="lede">Submit itemized expenses once. The policy check, manager decision, and payment hand-off stay visible from beginning to end.</p></div><div class="date">Local demo workspace<br>28 September 2026</div></header>
    <div class="layout">
        <section><h2>Submit a claim</h2><label for="employee">Employee</label><select id="employee"></select><label>Expense items</label><div id="items"></div><button class="secondary" onclick="addItem()">+ Add another item</button><div class="notice" id="notice"></div><div class="actions"><button onclick="submitClaim()">Send for approval</button></div></section>
        <section><h2>Claims in motion</h2><div class="tabs"><button class="active" onclick="loadClaims(this,'')">All</button><button onclick="loadClaims(this,'manager')">Manager review</button><button onclick="loadClaims(this,'finance')">Finance queue</button><button onclick="loadClaims(this,'override')">Needs override</button></div><div id="claims"><div class="empty">Loading claims...</div></div></section>
    </div>
</main>
<script>
let currentStage='';
function addItem(){ document.getElementById('items').insertAdjacentHTML('beforeend','<div class="item"><input class="category" placeholder="Category, e.g. Meals"><input class="amount" type="number" min="1" step="0.01" placeholder="Amount"></div>'); }
function message(text){const el=document.getElementById('notice');el.textContent=text;el.classList.add('show');}
async function loadEmployees(){const data=await fetch('/api/employees').then(r=>r.json());document.getElementById('employee').innerHTML=data.map(e=>`<option value="${e.id}">${e.name} · ${e.role}</option>`).join('');}
async function submitClaim(){const items=[...document.querySelectorAll('.item')].map(row=>({category:row.querySelector('.category').value,amount:Number(row.querySelector('.amount').value)}));const response=await fetch('/api/claims',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({employeeId:Number(document.getElementById('employee').value),items})});const data=await response.json();if(!response.ok){message(data.message);return;}message(`Claim #${data.id} created as ${data.status}.`);document.getElementById('items').innerHTML='';addItem();loadClaims(null,currentStage);}
async function loadClaims(button,stage){currentStage=stage;if(button){document.querySelectorAll('.tabs button').forEach(b=>b.classList.remove('active'));button.classList.add('active');}const url=stage?`/api/claims/pending?stage=${stage}`:'/api/claims';const data=await fetch(url).then(r=>r.json());document.getElementById('claims').innerHTML=data.length?data.map(claim=>`<article class="claim"><div class="claim-head"><span class="claim-id">Claim #${claim.id} · ${claim.employee.name}</span><span class="status">${claim.status}</span></div><p>${claim.items.map(i=>`${i.category} $${i.amount.toFixed(2)}${i.exceedsLimit?' · over limit':''}`).join(' &nbsp; · &nbsp; ')}</p><p>Total <strong>$${claim.totalAmount.toFixed(2)}</strong></p>${claim.status==='SUBMITTED'||claim.status==='NEEDS_OVERRIDE'?'<div class="claim-actions"><button onclick="decide('+claim.id+',true)">Approve</button><button class="secondary" onclick="decide('+claim.id+',false)">Reject</button></div>':''}${claim.status==='MANAGER_APPROVED'?'<div class="claim-actions"><button onclick="pay('+claim.id+')">Record payment</button></div>':''}</article>`).join(''):'<div class="empty">Nothing is waiting here.</div>';}
async function decide(id,approved){const override=approved&&confirm('This can only proceed for an over-limit claim with a manager override. Confirm override?');const response=await fetch(`/api/claims/${id}/manager-decision`,{method:'PATCH',headers:{'Content-Type':'application/json'},body:JSON.stringify({approved,overridePolicyLimit:override,remarks:approved?'Reviewed and approved':'Reviewed and rejected'})});const data=await response.json();if(!response.ok)alert(data.message);loadClaims(null,currentStage);}
async function pay(id){const reference=prompt('Enter the payment reference:');if(!reference)return;const response=await fetch(`/api/claims/${id}/payment`,{method:'PATCH',headers:{'Content-Type':'application/json'},body:JSON.stringify({paymentReference:reference})});const data=await response.json();if(!response.ok)alert(data.message);loadClaims(null,currentStage);}
loadEmployees();addItem();loadClaims(null,'');
</script></body></html>
